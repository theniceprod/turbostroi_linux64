name: Build Windows DLL

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clone garrysmod_common
      run: |
        git clone --recursive https://github.com ../garrysmod_common
      shell: bash

    - name: Setup Premake
      uses: abel0b/setup-premake@v2
      with:
        version: '5.0.0-beta2'

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Generate Visual Studio Files
      run: premake5 vs2022
      env:
        GARRYSMOD_COMMON: ../garrysmod_common

    - name: Build Solution (Release x64)
      run: msbuild *.sln /p:Configuration=Release /p:Platform=x64
      # Если сборка упадет на этом шаге, возможно проекту нужна 32-битная платформа. 
      # В таком случае x64 ниже нужно будет поменять на Win32 или x86.

    - name: Upload DLL Artifact
      uses: actions/upload-artifact@v4
      with:
        name: gmsv_turbostroi_dll
        path: |
          **/*.dll
