name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Update submodules
        run: git submodule update --remote --recursive

      - name: Install Boost
        run: sudo apt-get update && sudo apt-get install -y libboost-thread-dev libboost-chrono-dev libboost-system-dev

      - name: Build LuaJIT
        run: |
          mkdir -p external/luajit/linux64
          git clone https://github.com/LuaJIT/LuaJIT.git temp_luajit
          cd temp_luajit && make -j$(nproc)
          cp src/libluajit.a ../external/luajit/linux64/liblua51.a

      - name: Install Premake
        run: |
          wget https://github.com/premake/premake-core/releases/download/v5.0.0-beta2/premake-5.0.0-beta2-linux.tar.gz
          tar -xzf premake-5.0.0-beta2-linux.tar.gz
          
      - name: Patch garrysmod_common for Linux x86_64
        run: |
          find external/garrysmod_common -name "bitbuf.h" -exec sed -i 's/sizeof(long) == sizeof(float)/sizeof(int) == sizeof(float)/g' {} +
          find external/garrysmod_common -name "threadtools.h" -exec sed -i 's/sizeof(T) == sizeof(long)/sizeof(T) == sizeof(int)/g' {} +

      - name: Fix processor_detect_linux for x86_64
        run: |
          for f in $(find external/garrysmod_common -name "processor_detect_linux.cpp"); do
            echo -e '#include "tier0/platform.h"\nbool CheckMMX() { return true; }\nbool CheckSSE() { return true; }\nbool CheckSSE2() { return true; }\nbool Check3DNow() { return false; }\nbool CheckCMOV() { return true; }' > "$f"
          done

      - name: Download GMod x64 binaries
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update && sudo apt-get install -y lib32gcc-s1 lib32stdc++6
          mkdir -p /tmp/steamcmd /tmp/gmod
          curl -sqL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar zxvf - -C /tmp/steamcmd
          /tmp/steamcmd/steamcmd.sh +quit
          /tmp/steamcmd/steamcmd.sh +@sSteamCmdForcePlatformType linux +force_install_dir /tmp/gmod +login anonymous +app_update 4020 -beta x86-64 validate +quit
          sudo find /tmp/gmod -name "*.so" -exec cp {} /usr/lib/x86_64-linux-gnu/ \;
          cd /usr/lib/x86_64-linux-gnu/
          sudo cp $(ls *tier0*.so | head -n 1) libtier0.so
          sudo cp $(ls *tier0*.so | head -n 1) libtier0_srv.so
          sudo cp $(ls *vstdlib*.so | head -n 1) libvstdlib.so
          sudo cp $(ls *vstdlib*.so | head -n 1) libvstdlib_srv.so
            
      - name: Build LuaJIT with PIC
        run: |
            git clone --depth 1 https://github.com/LuaJIT/LuaJIT.git /tmp/luajit
            make -C /tmp/luajit BUILDMODE=static CFLAGS="-fPIC"
            mkdir -p external/luajit/linux64
            cp /tmp/luajit/src/libluajit.a external/luajit/linux64/liblua51.a
        
      - name: Generate and Build
        run: |
            PROJECT_GENERATOR_VERSION=3 ./premake5 gmake --gmcommon=external/garrysmod_common
            MF=$(find . -name "gmsv_turbostroi.make" | head -n 1)
            sed -i 's/linux32/linux64/g' "$MF"
            make -C "$(dirname "$MF")" config=release_x86_64 LDFLAGS="-L$GITHUB_WORKSPACE/external/bin64" CXXFLAGS="$CXXFLAGS -fpermissive"

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
            name: gmsv_turbostroi_linux64
            path: |
                **/*.so
                **/*.dll
